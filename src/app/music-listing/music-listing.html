<div class="listing fade-in">
  
  <div class="header">
    <h1>Library</h1>
    <div class="centered-row">
      <input 
        type="text" 
        class="search-bar" 
        placeholder="Search for songs..." 
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event); onSearchChange()"
      >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sort-down-alt" viewBox="0 0 16 16">
        <path d="M3.5 3.5a.5.5 0 0 0-1 0v8.793l-1.146-1.147a.5.5 0 0 0-.708.708l2 1.999.007.007a.497.497 0 0 0 .7-.006l2-2a.5.5 0 0 0-.707-.708L3.5 12.293zm4 .5a.5.5 0 0 1 0-1h1a.5.5 0 0 1 0 1zm0 3a.5.5 0 0 1 0-1h3a.5.5 0 0 1 0 1zm0 3a.5.5 0 0 1 0-1h5a.5.5 0 0 1 0 1zM7 12.5a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 0-1h-7a.5.5 0 0 0-.5.5"/>
      </svg>
      <select
        [(ngModel)]="sortingCriterion"
        (ngModelChange)="applySortingThenGrouping()">
        @for (criterion of sortingCriteria; track criterion) {
          <option [value]="criterion">{{ criterion }}</option>
        }
      </select>
      <small> | </small>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-collection-fill" viewBox="0 0 16 16">
        <path d="M0 13a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 16 13V6a1.5 1.5 0 0 0-1.5-1.5h-13A1.5 1.5 0 0 0 0 6zM2 3a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 0-1h-11A.5.5 0 0 0 2 3m2-2a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 0-1h-7A.5.5 0 0 0 4 1"/>
      </svg>
      <select
        [(ngModel)]="groupingCriterion"
        (ngModelChange)="applySortingThenGrouping()">
        @for (criterion of groupingCriteria; track criterion) {
          <option [value]="criterion">{{ criterion }}</option>
        }
      </select>
    </div>
  </div>

  <!-- can't destructure, [0] is group name, [1] is the group -->
  @for (songGroup of sortedSongGroups(); track songGroup[0]) {
    <h1>{{ songGroup[0] }}</h1>
    <div class="song-grid">
      @for (song of songGroup[1]; track song) {
        <app-song-container
          class="clickable-card"
          (click)="play(song)"
          [song]="song"
        />
      }
    </div>
  } @empty {
    <div class="empty-state">
      <p>No songs found.</p>
    </div>
  }

      />
    } -->

</div>
