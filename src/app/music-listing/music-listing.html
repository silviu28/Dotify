<div class="listing glassmorph-container">
  <h1>Welcome back</h1>
  <div class="song-grid">
    @for (song of songs(); track $index) {
      <app-song-container
        [title]="song.title"
        [artist]="song.artist"
        [album]="song.album || 'single'"
        [year]="song.year"
        [albumArt]="song.albumArt"
      />
    } 
    @empty {
      <p>Nothing to show.</p>
    }
  </div>
  <app-artist-listing />
</div>
