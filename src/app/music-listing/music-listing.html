<div class="listing glassmorph-container">
  <h1>Library</h1> <div class="song-grid">
    @for (song of songs(); track $index) {
      
      <app-song-container
        (click)="play(song)"
        class="clickable-card"
        [title]="song.title"
        [artist]="song.artist"
        [album]="song.album || 'Single'"
        [year]="song.year"
        [albumArt]="song.albumArt"
      />

    } 
    @empty {
      <div class="empty-state">
        <p>No songs found.</p>
      </div>
    }
  </div>

  <app-artist-listing />
</div>
