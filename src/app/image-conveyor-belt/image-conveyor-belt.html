<div class="carousel-container glassmorph-container" style="padding:10px;">
  <div class="carousel-track" [style.transform]="transformStyle()">
    @for (song of songs(); track song) {
      <button
        type="button"
        class="carousel-item"
        (click)="playSong(song)"
        [attr.aria-label]="'Play ' + song.title">
        <img [src]="song.albumArt || '/blank.png'" [alt]="song.album + ' cover art'" />
      </button>
    }
    @for (song of songs(); track song) {
      <button
        type="button"

        [attr.aria-label]="'Play ' + song.title">
        <img [src]="song.albumArt || '/blank.png'" [alt]="song.album + ' cover art'" />
      </button>
    }
  </div>
</div>
