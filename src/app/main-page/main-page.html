<div class="main-page-container fade-in">
  <app-image-conveyor-belt [reversed]="true" />
  <header class="greeting-section">
    <h1>Hello, {{ username() }} 👋</h1>
  </header>

  <section class="hero-banner">
    <div class="hero-content">
      <h2>Ready for some music?</h2>
      <p>Dive into your full collection of songs.</p>
      
      <button routerLink="/songs" class="library-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2.5 3.5a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1zm2-2a.5.5 0 0 1 0-1h7a.5.5 0 0 1 0 1zM0 13a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 16 13V6a1.5 1.5 0 0 0-1.5-1.5h-13A1.5 1.5 0 0 0 0 6zm5.5-4a.5.5 0 0 1 .8-.4l3 2a.5.5 0 0 1 0 .8l-3 2a.5.5 0 0 1-.8-.4z"/>
        </svg>
        Open Library
      </button>
    </div>
  </section>
  <app-image-conveyor-belt />

  <app-recently-played />
</div>
