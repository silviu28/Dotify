<div class="album-page glassmorph-container fade-in">
  <h1>{{ album().name }}</h1>
  <div class="songs-grid">
    @for (song of album().songs; track $index) {
      <app-song-container [song]="song" />
    } @empty {
      <div>
        <h1>404</h1>
        <p>Not found.</p>
      </div>
    }
  </div>
</div>
